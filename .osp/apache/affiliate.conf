# Reverb reverse-proxy for local HTTPS domain `https://glued`
# Apache vhost includes this file automatically via:
# IncludeOptional "$base_dir/.osp/apache/$host.conf"

<IfModule proxy_module>
    ProxyRequests Off
    ProxyPreserveHost On

    # WebSocket endpoint for Echo/Reverb (wss://glued/app/*)
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/app/ [NC]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$ http://127.0.0.1:8080/app/$1 [P,L]

    # Fallback for non-upgrade requests to /app/*
    ProxyPass        /app/  http://127.0.0.1:8080/app/
    ProxyPassReverse /app/  http://127.0.0.1:8080/app/

    # Reverb HTTP API endpoints used by broadcaster
    ProxyPass        /apps/ http://127.0.0.1:8080/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/
</IfModule>
